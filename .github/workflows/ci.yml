name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ninja-build
      - run: cmake -S test -B test/build -G Ninja && cmake --build test/build && ctest --test-dir test/build --output-on-failure
